[project]
name = "zhuozhi-learning-engine"
version = "0.1.0"
description = "啄知 AI 乙方 B1–B8 学习引擎"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20",
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-pptx>=1,<2",
  "pillow>=10",
  "rapidocr-onnxruntime>=1.4,<2",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI Depends/File/Query defaults are framework descriptors.
